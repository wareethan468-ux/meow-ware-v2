name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "main.pyw"
      - "build_macos.py"
      - "requirements.txt"
      - "package.json"
      - "package-lock.json"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build Vellium Tweaker for macOS
        run: python build_macos.py
      - name: Archive application bundle
        run: ditto -c -k --sequesterRsrc --keepParent "dist-macos/Vellium Tweaker.app" "dist-macos/Vellium-Tweaker-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Vellium-Tweaker-macOS
          path: dist-macos/Vellium-Tweaker-macOS.zip
          if-no-files-found: error
